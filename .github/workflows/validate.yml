name: Godot validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import and parse project headlessly
        run: godot --headless --editor --path . --quit
      - name: Parse all core scripts explicitly
        run: godot --headless --path . --script tests/parse_scripts.gd
      - name: Run the game scene for 120 frames
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee /tmp/neon-abyss-runtime.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/neon-abyss-runtime.log; then
            echo "Godot reported runtime errors."
            exit 1
          fi
      - name: Validate required systems
        run: |
          set -euo pipefail
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/game_root.gd
          test -f scripts/city_streamer.gd
          test -f scripts/city_chunk.gd
          test -f scripts/player_controller.gd
          test -f scripts/network_manager.gd
          test -f scripts/rental_manager.gd
          test -f scripts/employment_manager.gd
          test -f scripts/apartment_interior.gd
          test -f scripts/elevator_car.gd
          test -f scripts/elevator_landing_door.gd
          test -f scripts/weather_controller.gd
          test -f scripts/traffic_system.gd
          test -f shaders/wet_asphalt.gdshader
          grep -q 'ENetMultiplayerPeer' scripts/network_manager.gd
          grep -q 'MultiMeshInstance3D' scripts/city_chunk.gd
          grep -q 'fog_enabled' scripts/game_root.gd
          grep -q 'rental_manager.gd' scripts/game_root.gd
          grep -q 'register_building' scripts/city_chunk.gd
          grep -q '_append_building_frontage' scripts/city_chunk.gd
          grep -q 'RENTABLE UNITS' scripts/city_chunk.gd
          grep -q '_decorate_street_level' scripts/city_chunk.gd
          grep -q 'PedestrianPromenadeTiles' scripts/city_chunk.gd
          grep -q 'ArterialCrosswalkMarkings' scripts/city_chunk.gd
          grep -q 'StormDrainGrates' scripts/city_chunk.gd
          grep -q 'JungleCanopies' scripts/city_chunk.gd
          grep -q 'StreetWasteBins' scripts/city_chunk.gd
          grep -q 'PublicBenchParts' scripts/city_chunk.gd
          grep -q '_append_hollow_tower' scripts/city_chunk.gd
          grep -q 'stair_opening_x' scripts/city_chunk.gd
          grep -q 'stair_color' scripts/city_chunk.gd
          grep -q 'rail_angle' scripts/city_chunk.gd
          grep -q 'door_y' scripts/city_chunk.gd
          grep -q 'display_pos' scripts/city_chunk.gd
          grep -q '_add_elevator_car' scripts/city_chunk.gd
          grep -q 'ElevatorFloorLandings' scripts/city_chunk.gd
          grep -q 'elevator_car.gd' scripts/city_chunk.gd
          grep -q 'elevator_use' scripts/game_root.gd
          grep -q '_server_request_floor' scripts/elevator_car.gd
          grep -q '_broadcast_floor' scripts/elevator_car.gd
          grep -q '_build_cab_doors' scripts/elevator_car.gd
          grep -q '_set_doors_open' scripts/elevator_car.gd
          grep -q 'travel_started' scripts/elevator_car.gd
          grep -q 'floor_arrived' scripts/elevator_car.gd
          grep -q 'on_floor_arrived' scripts/elevator_landing_door.gd
          grep -q 'AnimatableBody3D' scripts/elevator_landing_door.gd
          grep -q '_make_panel' scripts/elevator_landing_door.gd
          grep -q 'LANDING_DOORS' scripts/city_chunk.gd
          grep -q 'lift_colliders.append' scripts/city_chunk.gd
          grep -q 'facade_bridge' scripts/city_chunk.gd
          grep -q 'floor_width' scripts/city_chunk.gd
          grep -q 'guide_size' scripts/city_chunk.gd
          grep -q 'header_size' scripts/city_chunk.gd
          grep -q 'Label3D.new' scripts/city_chunk.gd
          grep -q 'bridge_length' scripts/city_chunk.gd
          grep -q '_add_elevator_car' scripts/city_chunk.gd
          grep -q '_build_apartment_access' scripts/rental_manager.gd
          grep -q 'LandingCorridor' scripts/rental_manager.gd
          grep -q 'unit_offsets' scripts/rental_manager.gd
          grep -q 'access_corridor' scripts/rental_manager.gd
          grep -q 'EntryDoorLeft' scripts/apartment_interior.gd
          grep -q '_animate_entry_doors' scripts/apartment_interior.gd
          grep -q 'floor_height' scripts/rental_manager.gd
          grep -q 'register_workplace' scripts/city_chunk.gd
          grep -q '_server_clock_in' scripts/employment_manager.gd
          grep -q 'work_board' scripts/game_root.gd
          grep -q '_request_rent' scripts/rental_manager.gd
          grep -q '_server_enter_unit' scripts/rental_manager.gd
          grep -q '_request_enter_unit' scripts/rental_manager.gd
          grep -q '_grant_unit_entry' scripts/rental_manager.gd
          grep -q '_request_exit_unit' scripts/rental_manager.gd
          grep -q '_cancel_entry_request' scripts/rental_manager.gd
          grep -q 'interior_rooms_by_peer' scripts/rental_manager.gd
          grep -q '_identity_for_peer' scripts/rental_manager.gd
          grep -q 'interior_peers.erase' scripts/network_manager.gd
          grep -q 'set_local_interior' scripts/network_manager.gd
          grep -q '_transit_access_stairs' scripts/city_chunk.gd
          grep -q 'TransitPedestrianAccess' scripts/city_chunk.gd
          grep -q 'TransitStairCollision' scripts/city_chunk.gd
          echo "Godot import, runtime and structure checks passed."
